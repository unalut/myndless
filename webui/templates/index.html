<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myndless</title>
<link rel="icon" href="{{ url_for('static', filename='logo.svg') }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #96536a;
    --border: #e8dfe3;
    --mynd-gray: #4b4a4c;
    --less-mauve: #a8637d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  h1.logo {
    font-family: "Poppins", -apple-system, sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: -0.01em;
    line-height: 1;
    margin: 0;
  }
  h1.logo .mynd { color: var(--mynd-gray); }
  h1.logo .less { font-weight: 600; color: var(--less-mauve); }
  .suma-logo { height: 20px; width: auto; display: block; }
  .suma-logo { color: var(--text); flex-shrink: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .source-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: white;
  }
  .source-badge.none { background: var(--border); color: var(--muted); }
  button {
    font: inherit;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    background: var(--accent);
    color: white;
  }
  button.secondary { background: var(--border); color: var(--text); }
  button:active { opacity: 0.7; }
  .station-list { display: flex; flex-direction: column; gap: 8px; }
  .station {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .station .meta { min-width: 0; }
  .station .meta .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .station .meta .detail { display: block; font-size: 12px; color: var(--muted); }
  .station-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .search-row { display: flex; gap: 8px; margin-top: 14px; }
  .search-row input[type=text] {
    flex: 1;
    font: inherit;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .station.playing { border-color: var(--accent); }
  .volume-row { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; }
  #volumeValue { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1 class="logo"><span class="mynd">MYND</span><span class="less">less</span></h1>
    <img class="suma-logo" src="{{ url_for('static', filename='suma_logo.png') }}" alt="SUMA">
  </div>
  <div class="subtitle">MYNDberry, without moOde.</div>

  <div class="card">
    <h2>Now playing</h2>
    <div class="row">
      <span id="sourceBadge" class="source-badge none">idle</span>
      <button class="secondary" onclick="stopRadio()">Stop</button>
    </div>
  </div>

  <div class="card">
    <h2>Volume</h2>
    <div class="volume-row">
      <input type="range" id="volumeSlider" min="0" max="100" value="50"
             oninput="document.getElementById('volumeValue').textContent = this.value + '%'"
             onchange="setVolume(this.value)">
      <span id="volumeValue">50%</span>
    </div>
  </div>

  <div class="card">
    <h2>Spotify Connect</h2>
    <div class="row">
      <span class="subtitle" style="margin:0">Pick "myndless" in any Spotify app to switch here. You can control myndless only from your phone.</span>
      <button class="secondary" onclick="activateSpotify()">Activate</button>
    </div>
  </div>

  <div class="card">
    <h2>Internet radio</h2>
    <div id="stationList" class="station-list"></div>

    <div class="search-row">
      <input type="text" id="stationSearchInput" placeholder="Find a station to add (e.g. jazz, BBC, NPR)…"
             onkeydown="if (event.key === 'Enter') searchStations()">
      <button class="secondary" onclick="searchStations()">Search</button>
    </div>
    <div id="searchStatus" class="subtitle" style="margin:8px 0 0"></div>
    <div id="searchResults" class="station-list" style="margin-top:8px"></div>
  </div>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

async function refreshStatus() {
  const status = await api('/api/status');
  const badge = document.getElementById('sourceBadge');
  if (status.active_source === 'radio' && status.current_station) {
    badge.textContent = 'Radio: ' + status.current_station.name;
    badge.className = 'source-badge';
  } else if (status.active_source === 'spotify') {
    badge.textContent = 'Spotify Connect';
    badge.className = 'source-badge';
  } else {
    badge.textContent = 'idle';
    badge.className = 'source-badge none';
  }

  const slider = document.getElementById('volumeSlider');
  if (document.activeElement !== slider) {
    slider.value = status.volume_percent;
    document.getElementById('volumeValue').textContent = status.volume_percent + '%';
  }

  document.querySelectorAll('.station').forEach(el => {
    el.classList.toggle('playing', status.current_station && el.dataset.id === status.current_station.id);
  });
}

async function loadStations() {
  const stations = await api('/api/radio/stations');
  const list = document.getElementById('stationList');
  list.innerHTML = '';
  for (const station of stations) {
    const row = document.createElement('div');
    row.className = 'station';
    row.dataset.id = station.id;
    row.innerHTML = `<span>${station.name}</span>`;

    const actions = document.createElement('div');
    actions.className = 'station-actions';

    const playBtn = document.createElement('button');
    playBtn.textContent = 'Play';
    playBtn.onclick = () => playStation(station.id);
    actions.appendChild(playBtn);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'secondary';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => removeStation(station.id, station.name);
    actions.appendChild(removeBtn);

    row.appendChild(actions);
    list.appendChild(row);
  }
}

function playStation(id) { api(`/api/radio/play/${id}`, { method: 'POST' }).then(refreshStatus); }
function stopRadio() { api('/api/radio/stop', { method: 'POST' }).then(refreshStatus); }
async function removeStation(id, name) {
  if (!confirm(`Remove "${name}" from the station list?`)) return;
  await api(`/api/radio/stations/${id}`, { method: 'DELETE' });
  await loadStations();
  refreshStatus();
}
function activateSpotify() { api('/api/spotify/activate', { method: 'POST' }).then(refreshStatus); }
function setVolume(percent) {
  api('/api/volume', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ percent: Number(percent) }),
  }).then(refreshStatus);
}

let searchToken = 0;

async function searchStations() {
  const query = document.getElementById('stationSearchInput').value.trim();
  const statusEl = document.getElementById('searchStatus');
  const resultsEl = document.getElementById('searchResults');
  if (!query) {
    statusEl.textContent = '';
    resultsEl.innerHTML = '';
    return;
  }

  const token = ++searchToken;
  statusEl.textContent = 'Searching Radio Browser…';
  resultsEl.innerHTML = '';

  let results;
  try {
    results = await api(`/api/radio/search?q=${encodeURIComponent(query)}`);
  } catch (err) {
    if (token === searchToken) statusEl.textContent = 'Search failed - try again.';
    return;
  }
  if (token !== searchToken) return; // a newer search superseded this one

  if (results.length === 0) {
    statusEl.textContent = 'No stations found.';
    return;
  }
  statusEl.textContent = `${results.length} result${results.length === 1 ? '' : 's'}:`;

  for (const result of results) {
    const row = document.createElement('div');
    row.className = 'station';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const detail = [result.country, result.bitrate ? `${result.bitrate}kbps` : ''].filter(Boolean).join(' · ');
    meta.innerHTML = `<span class="name">${result.name}</span><span class="detail">${detail}</span>`;
    row.appendChild(meta);

    const addBtn = document.createElement('button');
    addBtn.className = 'secondary';
    addBtn.textContent = '+ Add';
    addBtn.onclick = () => addStation(result, addBtn);
    row.appendChild(addBtn);

    resultsEl.appendChild(row);
  }
}

async function addStation(result, buttonEl) {
  buttonEl.disabled = true;
  buttonEl.textContent = 'Adding…';
  try {
    await api('/api/radio/stations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: result.stationuuid ? `rb-${result.stationuuid}` : undefined,
        name: result.name,
        url: result.url,
      }),
    });
    buttonEl.textContent = 'Added ✓';
    await loadStations();
  } catch (err) {
    buttonEl.disabled = false;
    buttonEl.textContent = '+ Add';
  }
}

loadStations();
refreshStatus();
setInterval(refreshStatus, 3000);
</script>
</body>
</html>
